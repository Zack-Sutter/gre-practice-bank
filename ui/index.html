<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRE Practice</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body class="mode-quant">
  <header class="header">
    <button class="title title-toggle" id="mode-title" type="button" aria-label="Switch to vocab practice">
      GRE<span class="title-accent" id="mode-accent">quant</span>
    </button>
    <div class="stats" id="stats">
      <div class="dist-wrap" title="Rating distribution">
        <div class="dist-chart" id="dist-bar" aria-label="Rating distribution"></div>
      </div>
      <div class="stat-summary">
        <div class="avg-rating" id="avg-rating" title="Average rating">
          <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z" fill="currentColor"/>
          </svg>
          <span id="avg-value">—</span>
        </div>
        <div class="avg-time" id="avg-time" title="Average time">
          <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span id="avg-time-value">0:00</span>
        </div>
      </div>
    </div>
  </header>

  <main class="practice-layout">
    <article class="card" id="question-card">
      <div class="question-body" id="question-body"></div>
      <span class="prior-stats hidden" id="prior-stats"></span>
      <a class="source-link" id="source-link" href="#" target="_blank" rel="noopener noreferrer">Source</a>

      <div class="answer-section">
        <div class="reveal-bar">
          <button class="btn btn-primary" id="reveal-btn" type="button">Reveal Answer</button>
        </div>
        <div class="choices hidden" id="choices" role="group" aria-label="Answer choices"></div>
        <div class="answer hidden" id="answer"></div>
      </div>

      <div class="stars-row hidden" id="stars">
        <div class="stars" role="group" aria-label="Rate your ability">
          <button class="star" type="button" data-rating="1" aria-label="1 star">★</button>
          <button class="star" type="button" data-rating="2" aria-label="2 stars">★</button>
          <button class="star" type="button" data-rating="3" aria-label="3 stars">★</button>
          <button class="star" type="button" data-rating="4" aria-label="4 stars">★</button>
          <button class="star" type="button" data-rating="5" aria-label="5 stars">★</button>
        </div>
        <div class="comment-inline" id="comment-inline">
          <div class="comment-empty" id="comment-empty">
            <button class="btn-icon" id="comment-add-btn" type="button" aria-label="Add note">
              <svg class="comment-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 7.5A1.5 1.5 0 0 1 6.5 6H13.5M15.5 8.5V13.5A1.5 1.5 0 0 1 14 15H9.5L7 17.5V15H6.5A1.5 1.5 0 0 1 5 13.5V7.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17.5 4.5v3M16 6h3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="comment-view hidden" id="comment-view">
            <div class="comment-label-row">
              <span class="comment-title">personal note</span>
              <button class="btn-icon" id="comment-edit-btn" type="button" aria-label="Edit note">
                <svg class="comment-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <div class="comment-box">
              <p class="comment-text" id="comment-text"></p>
            </div>
          </div>
          <div class="comment-edit hidden" id="comment-edit">
            <div class="comment-label-row">
              <span class="comment-title">personal note</span>
              <div class="comment-box-actions">
                <button class="btn-icon" id="comment-save-btn" type="button" aria-label="Save note">
                  <svg class="comment-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <button class="btn-icon" id="comment-cancel-btn" type="button" aria-label="Cancel">
                  <svg class="comment-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="comment-box">
              <textarea class="comment-input" id="comment-input" rows="1" placeholder="Your note…"></textarea>
            </div>
          </div>
        </div>
      </div>
    </article>

    <nav class="nav">
      <button class="btn" id="prev-btn" type="button" disabled>← Previous</button>
      <div class="timer" id="timer">
        <span class="timer-display" id="timer-display">0:00</span>
        <button class="btn btn-timer" id="timer-toggle" type="button" aria-label="Pause">
          <span class="timer-glyph timer-glyph-pause" aria-hidden="true"></span>
          <span class="timer-glyph timer-glyph-play hidden" aria-hidden="true"></span>
        </button>
      </div>
      <button class="btn" id="next-btn" type="button">Next →</button>
    </nav>
  </main>

  <div class="error hidden" id="error"></div>
  <script src="/app.js"></script>
</body>
</html>
